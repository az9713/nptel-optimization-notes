name: Check and publish optimization notes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optimization-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install build and browser tools
        run: |
          python -m pip install -r requirements.txt playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Reproduce and validate the study edition
        run: |
          python tools/build.py
          python tools/manifest_artifacts.py
          git diff --exit-code -- '*.html' book.json source-manifest.json artifact-manifest.json
          python tools/check.py
          python tools/release_check.py
          python tools/browser_check.py
      - name: Stage the public committed package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/optimization-pages"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/optimization-pages"
      - name: Upload checked site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ${{ runner.temp }}/optimization-pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
